version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: student_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: studentdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: student_app
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_NAME: studentdb
      DB_USER: root
      DB_PASS: root
    stdin_open: true
    tty: true

volumes:
  mysql_data: